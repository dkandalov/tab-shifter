plugins {
    id "org.jetbrains.intellij.platform" version "2.10.4"
    id "org.jetbrains.kotlin.jvm" version "2.2.0"
    id "java"
    id "groovy"
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

sourceSets {
    main {
        java.srcDir "src"
        kotlin.srcDir "src"
        resources.srcDir "resources"
    }
}

// To find available IDE versions see https://www.jetbrains.com/intellij-repository/releases
// and https://www.jetbrains.com/intellij-repository/snapshots
//ext.ideVersion = "2025.2"
ext.ideVersion = "LATEST-EAP-SNAPSHOT"

dependencies {
    intellijPlatform {
        intellijIdeaCommunity(ideVersion, false)
    }
}

intellijPlatform {
    projectName = "tab-shifter"
    buildSearchableOptions = false // Disable because it takes a long time and the plugin doesn't need it
    pluginConfiguration {
        ideaVersion {
            // Disable patching plugin.xml because:
            // - "since" version can be earlier than current SDK (e.g. to specify major release 252 instead of specific EAP versoin)
            // - "until" version is better open-ended
            sinceBuild = provider { null }
            untilBuild = provider { null }
        }
    }
}

tasks {
    publishPlugin {
        token.set(System.getenv("PUBLISH_TOKEN"))
        hidden.set(true)
    }
}
